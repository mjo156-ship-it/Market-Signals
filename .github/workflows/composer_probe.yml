# Composer API Probe (read-only, manual)
# Discovers the watchlist / discover endpoints by scanning the app's public JS
# bundle and probing candidate endpoints. Writes nothing, commits nothing.
# Delete this workflow once the endpoints are known and wired into composer_oos.py.

name: Composer API Probe

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'JS bundle URL to scan (leave blank for the built-in default)'
        required: false
        default: ''
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe Composer API (read-only)
        env:
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          BUNDLE="${{ github.event.inputs.bundle }}"
          if [ -n "$BUNDLE" ]; then
            python scripts/composer_probe.py --bundle "$BUNDLE"
          else
            python scripts/composer_probe.py
          fi
