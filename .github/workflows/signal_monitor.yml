# Signal Monitor v4.7 - Updated 2026-04-13
# Monitors all backtested signals across 60+ tickers
# v4.7: Composer dry-run trades in daily emails (close only),
#        portfolio & symphony win rate tracking,
#        Composer API integration for live portfolio data
# v4.5: FXY carry trade, CPER copper regime, LABU/SOXL dip buy,
#        UVXY SMA200 cross, Bayesian Kelly on alerts
#        First email changed to 11:00 AM ET (was 3:15 PM)

name: Signal Monitor

on:
  schedule:
    # 11:00 AM Eastern = 16:00 UTC (mid-day preview)
    - cron: '00 16 * * 1-5'
    # 4:05 PM Eastern = 21:05 UTC (market close confirmation)
    - cron: '05 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'close'
        type: choice
        options:
          - preclose
          - close

jobs:
  check-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy scipy requests
      
      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: |
            ./data/breadth
            ./brier_scores.json
          key: signal-data-${{ github.run_number }}
          restore-keys: |
            signal-data-

      - name: Fetch Polygon breadth data
        if: env.POLYGON_API_KEY != ''
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python .github/workflows/fetch_polygon_grouped.py || echo "Polygon fetch failed — using yfinance fallback"
      
      - name: Determine run mode
        id: mode
        run: |
          # Check if this is the 11:00 AM run (16:00 UTC)
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          # If manually triggered, use the input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          # If it's around 16:00 UTC (11:00 AM ET), it's preclose
          elif [ "$HOUR" == "16" ] && [ "$MINUTE" -lt "30" ]; then
            echo "mode=preclose" >> $GITHUB_OUTPUT
          else
            echo "mode=close" >> $GITHUB_OUTPUT
          fi
      
      - name: Run signal monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PHONE_EMAIL: ${{ secrets.PHONE_EMAIL }}
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" == "preclose" ]; then
            python .github/workflows/signal_monitor_complete.py preclose
          else
            python .github/workflows/signal_monitor_complete.py
          fi
