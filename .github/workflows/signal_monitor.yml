# Signal Monitor v4.8 - Updated 2026-04-19
# Monitors all backtested signals including new v4.8 Groups 31-37
# Schedule: Mid-day preview at 11:00 AM ET + Market close at 4:05 PM ET

name: Signal Monitor

on:
  schedule:
    # 11:00 AM Eastern = 15:00 UTC (mid-day preview)
    - cron: '00 15 * * 1-5'
    # 4:05 PM Eastern = 20:05 UTC (market close confirmation)
    - cron: '05 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'close'
        type: choice
        options:
          - preclose
          - close

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Determine run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          # If it's around 15:00 UTC (11:00 AM ET), it's mid-day preview
          elif [ "$HOUR" == "15" ] && [ "$MINUTE" -lt "30" ]; then
            echo "mode=preclose" >> $GITHUB_OUTPUT
          else
            echo "mode=close" >> $GITHUB_OUTPUT
          fi

      - name: Run signal monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PHONE_EMAIL: ${{ secrets.PHONE_EMAIL }}
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" == "preclose" ]; then
            python .github/workflows/signal_monitor_complete.py preclose
          else
            python .github/workflows/signal_monitor_complete.py
          fi
