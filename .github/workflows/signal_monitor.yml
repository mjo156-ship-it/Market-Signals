# Signal Monitor v5.1 - Updated 2026-04-25
# Three emails daily (weekdays):
#   9:45 AM ET  - Post-open snapshot (open mode)
#   11:00 AM ET - Mid-day preview (preclose mode)
#   4:05 PM ET  - Market close confirmation (close mode)

name: Signal Monitor

on:
  schedule:
    # 9:45 AM Eastern = 13:45 UTC (post-open snapshot)
    # Note: ET is UTC-4 during DST (Mar-Nov) and UTC-5 in winter.
    # GitHub cron is UTC only -- this fires at 9:45 AM ET during DST,
    # 8:45 AM ET in winter. Adjust if you want strict 9:45 ET year-round.
    - cron: '45 13 * * 1-5'
    # 11:00 AM Eastern = 15:00 UTC (mid-day preview)
    - cron: '00 15 * * 1-5'
    # 4:05 PM Eastern = 20:05 UTC (market close confirmation)
    - cron: '05 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'close'
        type: choice
        options:
          - open
          - preclose
          - close

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Determine run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          # 13:45 UTC = 9:45 AM ET (DST) -- post-open
          elif [ "$HOUR" == "13" ] && [ "$MINUTE" -ge "30" ]; then
            echo "mode=open" >> $GITHUB_OUTPUT
          # 15:00 UTC = 11:00 AM ET (DST) -- mid-day preview
          elif [ "$HOUR" == "15" ] && [ "$MINUTE" -lt "30" ]; then
            echo "mode=preclose" >> $GITHUB_OUTPUT
          else
            echo "mode=close" >> $GITHUB_OUTPUT
          fi

      - name: Run signal monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PHONE_EMAIL: ${{ secrets.PHONE_EMAIL }}
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" == "open" ]; then
            python .github/workflows/signal_monitor_complete.py open
          elif [ "$MODE" == "preclose" ]; then
            python .github/workflows/signal_monitor_complete.py preclose
          else
            python .github/workflows/signal_monitor_complete.py
          fi
