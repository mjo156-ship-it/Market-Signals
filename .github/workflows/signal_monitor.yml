# Signal Monitor v5.2 - Updated 2026-04-25
# Three emails daily (weekdays) + JSON state committed back to this repo.
#
#   9:45 AM ET  - Post-open snapshot (open mode)
#   11:00 AM ET - Mid-day preview (preclose mode)
#   4:05 PM ET  - Market close confirmation (close mode)
#
# After each run, dashboard_state.json is committed back to this repo's
# main branch so it's readable at:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/dashboard_state.json

name: Signal Monitor

# Required for the workflow to push commits back to this repo
permissions:
  contents: write

on:
  schedule:
    # 9:45 AM Eastern = 13:45 UTC (post-open snapshot, DST)
    - cron: '45 13 * * 1-5'
    # 11:00 AM Eastern = 15:00 UTC (mid-day preview, DST)
    - cron: '00 15 * * 1-5'
    # 4:05 PM Eastern = 20:05 UTC (market close confirmation, DST)
    - cron: '05 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'close'
        type: choice
        options:
          - open
          - preclose
          - close
      prime_ibs:
        description: 'Prime the IBS Group 14 baseline (run ONCE to seed ~2000-present, then never again)'
        required: false
        default: false
        type: boolean

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # pandas_market_calendars / duckdb / pyarrow are for the post-close
          # price-store update (price_store.py); the rest are the monitor's.
          pip install yfinance pandas numpy requests pandas_market_calendars duckdb pyarrow

      - name: Determine run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          # 13:45 UTC = 9:45 AM ET (DST) -- post-open
          elif [ "$HOUR" == "13" ] && [ "$MINUTE" -ge "30" ]; then
            echo "mode=open" >> $GITHUB_OUTPUT
          # 15:00 UTC = 11:00 AM ET (DST) -- mid-day preview
          elif [ "$HOUR" == "15" ] && [ "$MINUTE" -lt "30" ]; then
            echo "mode=preclose" >> $GITHUB_OUTPUT
          else
            echo "mode=close" >> $GITHUB_OUTPUT
          fi

      - name: Run signal monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PHONE_EMAIL: ${{ secrets.PHONE_EMAIL }}
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          # One-time IBS Group 14 baseline priming (workflow_dispatch prime_ibs=true).
          if [ "${{ inputs.prime_ibs }}" == "true" ]; then
            echo "Priming IBS baseline (one-time; seeds ~2000-present)..."
            python ibs_tracker.py prime
          fi
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" == "open" ]; then
            python .github/workflows/signal_monitor_complete.py open
          elif [ "$MODE" == "preclose" ]; then
            python .github/workflows/signal_monitor_complete.py preclose
          else
            python .github/workflows/signal_monitor_complete.py
          fi

      # Commit the JSON state file back to this repo so it's readable
      # at a stable raw.githubusercontent.com URL.
      - name: Commit dashboard state
        if: success()
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -e
          if [ ! -f dashboard_state.json ]; then
            echo "No dashboard_state.json produced -- skipping commit"
            exit 0
          fi

          git config user.name "signal-monitor-bot"
          git config user.email "signal-monitor-bot@users.noreply.github.com"
          # dashboard_state.json every run; price store + signal research are
          # refreshed on the post-close (close) run only -- git add is a no-op
          # when unchanged.
          git add dashboard_state.json data/price_store/ data/signal_research/ ibs_tracker.json

          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            # Build an informative message: append a price-store summary
            # (date range, # tickers, corporate actions, quarantined rows)
            # from the updater's manifest when the price store changed.
            MSG="state update $(date -u +%Y-%m-%dT%H:%M:%SZ) [$RUN_MODE]"
            if git diff --cached --name-only | grep -q '^data/price_store/'; then
              PS=$(python -c "import json;m=json.load(open('data/price_store/_last_run.json'));c=m.get('coverage',{});a=m.get('actions_detected',[]);print('price-store: %s tickers thru %s, %s rows, %s corp-action repull(s)%s, %s quarantined' % (c.get('tickers','?'), c.get('latest_date','?'), m.get('rows_written',0), len(a), (' ('+','.join(a)+')') if a else '', m.get('quarantined',0)))" 2>/dev/null || echo 'price-store: updated')
              MSG="$MSG | $PS"
            fi
            git commit -m "$MSG"
            # Pull-rebase in case multiple runs land close together
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            echo "State committed: $MSG"
          fi
