# Signal Monitor v5.2 - Updated 2026-04-25
# Three emails daily (weekdays) + JSON state committed back to this repo.
#
#   9:45 AM ET  - Post-open snapshot (open mode)
#   11:00 AM ET - Mid-day preview (preclose mode)
#   4:05 PM ET  - Market close confirmation (close mode)
#
# After each run, dashboard_state.json is committed back to this repo's
# main branch so it's readable at:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/dashboard_state.json

name: Signal Monitor

# Required for the workflow to push commits back to this repo
permissions:
  contents: write

on:
  schedule:
    # 9:45 AM Eastern = 13:45 UTC (post-open snapshot, DST)
    - cron: '45 13 * * 1-5'
    # 11:00 AM Eastern = 15:00 UTC (mid-day preview, DST)
    - cron: '00 15 * * 1-5'
    # 4:05 PM Eastern = 20:05 UTC (market close confirmation, DST)
    - cron: '05 20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'close'
        type: choice
        options:
          - open
          - preclose
          - close
      prime_ibs:
        description: 'Prime the IBS baseline (run ONCE to seed ~2000-present history, then never again)'
        required: false
        default: false
        type: boolean

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests pandas_market_calendars

      - name: Determine run mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          # 13:45 UTC = 9:45 AM ET (DST) -- post-open
          elif [ "$HOUR" == "13" ] && [ "$MINUTE" -ge "30" ]; then
            echo "mode=open" >> $GITHUB_OUTPUT
          # 15:00 UTC = 11:00 AM ET (DST) -- mid-day preview
          elif [ "$HOUR" == "15" ] && [ "$MINUTE" -lt "30" ]; then
            echo "mode=preclose" >> $GITHUB_OUTPUT
          else
            echo "mode=close" >> $GITHUB_OUTPUT
          fi

      - name: Run signal monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PHONE_EMAIL: ${{ secrets.PHONE_EMAIL }}
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: |
          # One-time IBS baseline priming (workflow_dispatch prime_ibs=true).
          if [ "${{ inputs.prime_ibs }}" == "true" ]; then
            echo "Priming IBS baseline (one-time; seeds ~2000-present)..."
            python ibs_tracker.py prime
          fi
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" == "open" ]; then
            python .github/workflows/signal_monitor_complete.py open
          elif [ "$MODE" == "preclose" ]; then
            python .github/workflows/signal_monitor_complete.py preclose
          else
            python .github/workflows/signal_monitor_complete.py
          fi

      # Commit the JSON state file back to this repo so it's readable
      # at a stable raw.githubusercontent.com URL.
      - name: Commit dashboard state
        if: success()
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -e
          if [ ! -f dashboard_state.json ]; then
            echo "No dashboard_state.json produced -- skipping commit"
            exit 0
          fi

          git config user.name "signal-monitor-bot"
          git config user.email "signal-monitor-bot@users.noreply.github.com"
          git add dashboard_state.json

          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git commit -m "state update $(date -u +%Y-%m-%dT%H:%M:%SZ) [$RUN_MODE]"
            # Pull-rebase in case multiple runs land close together
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            echo "State committed"
          fi

      # Commit the refreshed price store (post-close run only). Isolated from the
      # state commit above so a price-store hiccup never blocks the signal pipeline.
      - name: Commit price store
        if: success() && steps.mode.outputs.mode == 'close'
        run: |
          set -e
          if [ ! -d data/price_store ]; then
            echo "No price store produced -- skipping commit"
            exit 0
          fi

          git config user.name "signal-monitor-bot"
          git config user.email "signal-monitor-bot@users.noreply.github.com"
          git add data/price_store

          if git diff --cached --quiet; then
            echo "No price-store change to commit"
          else
            MSG=$(cat price_store_commit_msg.txt 2>/dev/null || echo "price store update $(date -u +%F)")
            git commit -m "$MSG"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            echo "Price store committed: $MSG"
          fi

      # Commit the IBS tracker (close run persists gate state + firings; the
      # prime_ibs dispatch seeds the full-cycle baseline). Isolated so an IBS
      # hiccup never blocks the signal pipeline.
      - name: Commit IBS tracker
        if: success() && (steps.mode.outputs.mode == 'close' || inputs.prime_ibs == true)
        run: |
          set -e
          if [ ! -f ibs_tracker.json ]; then
            echo "No ibs_tracker.json produced -- skipping commit"
            exit 0
          fi

          git config user.name "signal-monitor-bot"
          git config user.email "signal-monitor-bot@users.noreply.github.com"
          git add ibs_tracker.json

          if git diff --cached --quiet; then
            echo "No IBS tracker change to commit"
          else
            git commit -m "ibs tracker update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
            echo "IBS tracker committed"
          fi
