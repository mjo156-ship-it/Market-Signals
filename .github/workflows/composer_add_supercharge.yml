name: Composer Add Supercharge
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  supercharge:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - name: Evaluate + build
        env:
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: python scripts/composer_add_supercharge.py
      - name: Commit symphony JSON
        if: success()
        run: |
          set -e
          shopt -s nullglob
          files=(data/revised6_portfolio_symphony.json data/revised6_tilt_symphony.json)
          [ ${#files[@]} -eq 0 ] && { echo "none"; exit 0; }
          git config user.name "composer-oos-bot"
          git config user.email "composer-oos-bot@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Build 6-sleeve supercharge portfolio symphony $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
