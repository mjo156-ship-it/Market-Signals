name: Composer Screen Corr Bootstrap
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  cb:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - name: Correlation + bootstrap
        env:
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: python scripts/composer_screen_corr_bootstrap.py
