name: Composer Pair Portfolio
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - name: Build + bootstrap pair portfolio
        env:
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: python scripts/composer_pair_portfolio.py
      - name: Commit symphony JSON
        if: success()
        run: |
          set -e
          [ -f data/bullhedge_2ndopus_symphony.json ] || { echo none; exit 0; }
          git config user.name "composer-oos-bot"
          git config user.email "composer-oos-bot@users.noreply.github.com"
          git add data/bullhedge_2ndopus_symphony.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Build BullHedge+2ndOpus pair portfolio symphony $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
