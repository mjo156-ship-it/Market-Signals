# Composer Portfolio Builder (manual, read-only)
# Backtests the high-confidence / OOS-consistent shortlist over a common OOS
# window, computes the return-correlation matrix, and searches combos of 5-7
# (inverse-vol weighted) for the best diversified portfolio with MaxDD < 20%.
# Commits data/portfolio_analysis.json. Uses only the permitted backtest POST.

name: Composer Portfolio Builder

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Build portfolio
        env:
          COMPOSER_KEY_ID: ${{ secrets.COMPOSER_KEY_ID }}
          COMPOSER_KEY_SECRET: ${{ secrets.COMPOSER_KEY_SECRET }}
        run: python scripts/composer_portfolio.py

      - name: Commit results
        if: success()
        run: |
          set -e
          git config user.name "composer-oos-bot"
          git config user.email "composer-oos-bot@users.noreply.github.com"
          git add data/portfolio_analysis.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "📊 Composer portfolio analysis $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
